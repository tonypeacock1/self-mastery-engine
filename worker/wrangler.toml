# Dianetics Geo-EFT Worker
# Isolated deployment. Do not share account or secrets with core platform Workers.

name = "dianetics-geo-eft"
main = "../src/modules/dianetics/dianetics_geo_router.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Environment variables (set via dashboard or wrangler secret)
# Required:
#   DIANETICS_SENDGRID_API_KEY
#   DIANETICS_CRM_WEBHOOK_URL
# Optional:
#   ALLOWED_ORIGINS   (comma-separated list for tighter CORS)

[vars]
# Non-secret defaults can live here if needed.

# Example production route binding (Cloudflare Pages same-origin preferred)
# routes = [
#   { pattern = "exec-resilience-sa.pages.dev/api/*", zone_name = "pages.dev" }
# ]

# For multi-platform absolute origin, simply deploy this Worker and inject
# the resulting *.workers.dev (or custom) origin into PslSiteConfig.workerOrigin.
